<!doctype html>

<head>
<meta charset="utf-8">

<body>
<title>Alistar's AI Projects</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Courier+Prime&family=Caveat:wght@500&family=DM+Sans:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">
<style>
/* Layout: a pixel-grown tree on poster paper. The canvas fills the screen; the camera drifts with the cursor and travels along a branch when a folder opens. */
:root{
  color-scheme:light;
  --paper:#ffffff; --ink:#23211e; --ink-2:#77716a; --hair:rgba(35,33,30,.14); --moss:#9db365;
  --sage:#6c7c4c; --cyano:#4e6a92; --slate:#2b3443; --bone:#f6f2e8;
  --f-display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --f-type:"Courier Prime","Courier New",ui-monospace,monospace;
  --slow:cubic-bezier(.45,0,.25,1);
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-display);overflow:hidden}
.app{position:relative;height:100%}
canvas#tree{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default;touch-action:none}

header{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-block:26px 0;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));pointer-events:none}
header>*{pointer-events:auto}
h1{font-weight:400;font-size:clamp(26px,3vw,38px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.04em}
.sub{margin:8px 0 0;font-family:var(--f-type);font-size:12px;color:var(--ink-2);letter-spacing:.06em}
.sub .touch{display:none}
@media (hover:none){.sub .mouse{display:none}.sub .touch{display:inline}}
.links{font-family:var(--f-type);font-size:12px;letter-spacing:.06em;padding-top:4px}
.links a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--hair)}
.links a:hover{border-color:var(--ink)}

#labels{position:absolute;inset:0;pointer-events:none;z-index:3}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;font-family:var(--f-type);font-size:12.5px;letter-spacing:.02em;color:var(--ink);background:none;border:0;padding:6px 8px 6px 4px;margin:0;cursor:pointer;white-space:nowrap;pointer-events:auto;text-decoration:none;opacity:0;transition:opacity 1.2s var(--slow),color .3s;will-change:transform}
.lbl.on{opacity:1}
.lbl.dim{opacity:.32}
.lbl svg{width:17px;height:15px;flex:none;overflow:visible}
.lbl svg *{fill:var(--paper);stroke:var(--ink);stroke-width:1;stroke-linejoin:round}
.lbl.open svg .fold-front{fill:var(--ink)}
.lbl .nm{padding:2px 3px;background:color-mix(in srgb,var(--paper) 82%,transparent);transition:background .3s,color .3s}
.lbl:hover .nm,.lbl:focus-visible .nm{background:var(--ink);color:var(--paper)}
.lbl:focus-visible{outline:none}
.lbl.root{cursor:pointer;color:var(--ink-2)}
.lbl.root .nm{font-style:normal}
.lbl.anc{color:var(--ink-2)}

.status{position:absolute;z-index:5;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;font-family:var(--f-type);font-size:11px;letter-spacing:.06em;color:var(--ink-2);border-top:1px solid var(--hair);background:color-mix(in srgb,var(--paper) 86%,transparent);padding-block:9px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-bottom:max(9px,env(safe-area-inset-bottom,0px))}
.status b{font-weight:400;color:var(--ink)}

/* overview: a small poster */
.ov{position:fixed;z-index:20;width:290px;color:var(--bone);background:var(--slate);padding:12px 12px 16px;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .45s var(--slow),transform .6s var(--slow)}
.ov.show{opacity:1;transform:none}
.ov[data-c="sage"]{background:var(--sage)} .ov[data-c="cyano"]{background:var(--cyano)} .ov[data-c="slate"]{background:var(--slate)}
.ov[data-c="bone"]{background:var(--bone);color:var(--ink);box-shadow:0 0 0 1px var(--hair)}
.ov .media{aspect-ratio:16/10;overflow:hidden;position:relative;display:grid;place-items:center;background:rgba(0,0,0,.12)}
.ov .media>video,.ov .media>img{width:100%;height:100%;object-fit:cover;display:block}
.ov h2{font-weight:400;font-size:25px;line-height:1.02;margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.ov p{margin:0 2px;font-size:17px;line-height:1.25}
.ov .about{margin:14px 2px 0;font-family:var(--f-type);font-size:10.5px;letter-spacing:.14em;opacity:.85}
.ov .about u{text-underline-offset:3px}
.ov .tbd{font-family:var(--f-type);font-size:10px;opacity:.7}
.ov .go{display:none}
.ov.sheet{left:0!important;right:0;bottom:0;top:auto!important;width:auto;pointer-events:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:118px minmax(0,1fr);gap:2px 14px;align-items:start}
.ov.sheet .media{grid-row:span 3;aspect-ratio:1}
.ov.sheet h2{margin:0 0 4px;font-size:22px}
.ov.sheet p{font-size:16px}
.ov.sheet .about{margin-top:8px}
.ov.sheet .go{display:flex;grid-column:1/-1;gap:8px;margin-top:12px}
.btn{white-space:nowrap;font-family:var(--f-type);font-size:12px;letter-spacing:.06em;border:1px solid currentColor;background:none;color:inherit;padding:11px 14px;cursor:pointer}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ov .btn.solid{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.ov[data-c="bone"] .btn.solid{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--moss);outline-offset:2px}

.pmini{width:56%;background:#fbfaf6;padding:7px 7px 22px;box-shadow:0 6px 14px rgba(0,0,0,.2);position:relative;transform:rotate(-2deg)}
.pmini .ph{aspect-ratio:1;position:relative;overflow:hidden;background:#e9e6dc}
.pmini img{width:100%;height:100%;object-fit:cover;filter:saturate(.72) contrast(.86) brightness(1.06) sepia(.08) hue-rotate(-6deg)}
.pmini .milk{position:absolute;inset:0;background:#ebe8de;animation:develop 6s ease-in-out infinite}
.pmini .st{position:absolute;font-size:22px;right:-8px;top:-10px;animation:stick 6s ease-in-out infinite}
@keyframes develop{0%,8%{opacity:1}55%,100%{opacity:0}}
@keyframes stick{0%,60%{transform:scale(0) rotate(-30deg);opacity:0}72%,100%{transform:scale(1) rotate(8deg);opacity:1}}

/* viewer */
.viewer{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;opacity:0;transition:opacity .6s var(--slow)}
.viewer.show{opacity:1}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:max(14px,env(safe-area-inset-top,0px)) 14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));font-family:var(--f-type);font-size:12px;letter-spacing:.04em;color:var(--ink-2);border-bottom:1px solid var(--hair)}
.vbar b{color:var(--ink);font-weight:400}
.vbody{flex:1;overflow:auto;padding-block:30px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.vin{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.vin h3{font-weight:400;font-size:clamp(30px,4.4vw,52px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.vin video{width:100%;max-height:74vh;object-fit:contain;background:#111;display:block}
.vin.portrait video{max-width:440px;margin:0 auto;background:none}
.vin img.full{width:100%;display:block}
.k{font-family:var(--f-type);font-size:11px;letter-spacing:.14em;text-transform:lowercase;color:var(--ink-2);margin-bottom:6px}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 36px}
.pair div{min-width:0}
.pair p{margin:0;font-size:21px;line-height:1.3}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{font-family:var(--f-type);font-size:12px;color:var(--ink-2);margin:0;letter-spacing:.04em}

/* polaroid tool (ported from Polara v4) */
.pa{width:min(100%,460px);height:min(780px,80vh);margin:0 auto;background:#0d0d0d;color:#eee;font-family:"DM Sans",system-ui,sans-serif;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 24px 50px -24px rgba(0,0,0,.45)}
.pa button{font-family:inherit}
.pa .top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#0a0a0a;border-bottom:1px solid #222;flex-shrink:0}
.pa .logo{font-family:"Caveat",cursive;font-size:24px;font-weight:500;color:#e8d5b0;letter-spacing:1px}
.pa .tabs{display:flex;gap:4px}
.pa .tab{padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;background:none;color:#777;border:0}
.pa .tab[aria-selected="true"]{background:#e8d5b0;color:#1a1a1a;font-weight:500}
.pa .pg{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.pa .cam{align-items:center;justify-content:center;gap:12px;padding:16px}
.pa .body{background:#1a1a1a;border-radius:20px;padding:14px;border:1px solid #2a2a2a;width:100%}
.pa .vf{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#000;border:2px solid #333;display:grid;place-items:center}
.pa .vf video{width:100%;height:100%;object-fit:cover;display:block}
.pa .vf .c{position:absolute;width:18px;height:18px;border:0 solid rgba(255,255,255,.4)}
.pa .vf .tl{top:8px;left:8px;border-width:2px 0 0 2px}.pa .vf .tr{top:8px;right:8px;border-width:2px 2px 0 0}.pa .vf .bl{bottom:8px;left:8px;border-width:0 0 2px 2px}.pa .vf .br{bottom:8px;right:8px;border-width:0 2px 2px 0}
.pa .flash{position:absolute;inset:0;background:#fffde0;opacity:0;pointer-events:none;transition:opacity .06s}
.pa .nocam{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;text-align:center;color:#888;font-size:13px;line-height:1.5}
.pa .pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:20px;border:0;cursor:pointer;font-size:13px;background:#e8d5b0;color:#1a1a1a;font-weight:500}
.pa .pill.dark{background:#252525;color:#bbb;font-weight:400}
.pa .modes{display:flex;gap:8px;margin:12px 0 4px}
.pa .mode{flex:1;padding:9px;border-radius:10px;border:1px solid #333;background:#222;color:#777;font-size:12px;cursor:pointer}
.pa .mode[aria-pressed="true"]{border-color:#e8d5b0;color:#e8d5b0;background:rgba(232,213,176,.08)}
.pa .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.pa .shutter{width:62px;height:62px;border-radius:50%;background:#e8d5b0;border:4px solid #fff;cursor:pointer;box-shadow:0 0 0 3px #444;position:relative;transition:transform .1s}
.pa .shutter:active{transform:scale(.91)}
.pa .shutter::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#d4a860}
.pa .side{width:40px;height:40px;border-radius:50%;background:#252525;border:0;color:#999;font-size:16px;cursor:pointer}
.pa .side:disabled{opacity:.25;cursor:default}
.pa .ed{background:#0d0d0d}
.pa .edmain{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.pa .frame{background:#f7f4ef;padding:10px 10px 48px;box-shadow:0 6px 24px rgba(0,0,0,.6);position:relative;display:inline-block}
.pa .imgw{position:relative;overflow:hidden;width:268px;height:268px;touch-action:none;background:#e9e6dc}
.pa .imgw canvas{width:100%;height:100%;display:block;transition:filter 2.4s ease}
.pa .milk{position:absolute;inset:0;background:#ebe8de;transition:opacity 2.6s ease-in-out;pointer-events:none}
.pa .stk{position:absolute;font-size:26px;cursor:move;user-select:none;-webkit-user-select:none;line-height:1;touch-action:none}
.pa .lab{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:"Caveat",cursive;font-size:19px;color:#666;min-height:26px;outline:none;padding:2px 10px}
.pa .lab:empty::before{content:"add a caption...";color:#ccc}
.pa .tb{background:#111;border-top:1px solid #1e1e1e;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.pa .row{display:flex;align-items:center;gap:8px}
.pa .tl2{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:1px;min-width:52px}
.pa .picker{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.pa .picker::-webkit-scrollbar{display:none}
.pa .pick{flex-shrink:0;width:34px;height:34px;border-radius:7px;background:#1e1e1e;border:1px solid #2a2a2a;font-size:18px;cursor:pointer}
.pa .save{background:#c8553d;color:#fff;border:0;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer}
.pa .retake{background:#1e1e1e;color:#999;border:0;padding:10px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.pa .gal{padding:16px}
.pa .gh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.pa .gt{font-family:"Caveat",cursive;font-size:26px;color:#e8d5b0}
.pa .gc{font-size:12px;color:#555}
.pa .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:20px}
.pa .gi{position:relative;transition:transform .2s}
.pa .gi:hover{transform:rotate(1.5deg) scale(1.04)}
.pa .gp{background:#f7f4ef;padding:7px 7px 26px;box-shadow:0 4px 14px rgba(0,0,0,.5);transform:rotate(var(--tilt,0deg))}
.pa .gp img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pa .gcap{display:none;position:absolute;bottom:5px;left:0;right:0;text-align:center;font-family:"Caveat",cursive;font-size:13px;color:#666;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa .gact{position:absolute;top:4px;right:4px;display:none;gap:4px}
.pa .gi:hover .gact,.pa .gi:focus-within .gact{display:flex}
@media (hover:none){.pa .gact{display:flex}}
.pa .gact button{width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.72);color:#ddd;border:0;font-size:12px;cursor:pointer}
.pa .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#555;font-size:13px;line-height:1.6}
.pa .toast{position:absolute;bottom:72px;left:50%;transform:translateX(-50%) translateY(16px);background:#e8d5b0;color:#1a1a1a;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap;z-index:5}
.pa .toast.show{opacity:1;transform:translateX(-50%)}
/* your ride (ported prototype) */
.ridewrap{display:flex;justify-content:center}
.phone{position:relative;width:min(100%,392px);aspect-ratio:390/844;max-width:100%;border-radius:clamp(36px,13%,56px)/clamp(36px,6%,56px);background:#0e0f0f;padding:10px;box-sizing:border-box;box-shadow:inset 0 0 0 1.5px #3b3e3c,0 30px 60px -28px rgba(0,0,0,.5)}
.phone::before{content:"";position:absolute;z-index:3;top:20px;left:50%;transform:translateX(-50%);width:31%;height:28px;border-radius:20px;background:#000}
.phone .clock{position:absolute;z-index:3;top:22px;left:13%;font:600 14px/24px "IBM Plex Sans",system-ui,sans-serif;color:#fff;letter-spacing:.01em}
.ride{width:100%;height:100%;overflow-y:auto;border-radius:inherit;box-sizing:border-box;padding:60px 16px 36px;color:#fff;font-family:"IBM Plex Sans",system-ui,sans-serif;background:linear-gradient(rgba(0,0,0,.34),rgba(0,0,0,.34)),radial-gradient(120% 80% at 30% 20%,#8b9483,#5c6359 60%,#454b43);scrollbar-width:none}
.ride::-webkit-scrollbar{display:none}
.ride button{font-family:inherit;color:#fff}
.ride .glass{border-radius:6px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ride .h{font:500 20px/1 "IBM Plex Sans",sans-serif;letter-spacing:.01em}
.ride .s12{font:300 12px/1.4 "IBM Plex Sans",sans-serif;color:rgba(255,255,255,.95)}
.ride input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:20px;margin:0;display:block}
.ride input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:100px;background:linear-gradient(90deg,#bdf2b6,rgba(255,255,255,.8),#fee7e1)}
.ride input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
.ride input[type=range]::-moz-range-track{height:6px;border-radius:100px;background:linear-gradient(90deg,#bdf2b6,rgba(255,255,255,.8),#fee7e1)}
.ride input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:0}
.ride input[type=number]{-moz-appearance:textfield}
.ride input::-webkit-outer-spin-button,.ride input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ride .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.ride .chips::-webkit-scrollbar{display:none}
.ride .chip{flex:none;background:none;border:0;padding:8px 0;cursor:pointer}
.ride .chip span{display:flex;align-items:center;height:28px;padding:4px 12px;border-radius:100px;font:400 12px/1 "IBM Plex Sans",sans-serif;white-space:nowrap;box-sizing:border-box;transition:background .18s,color .18s}
.ride .row{display:block;width:100%;text-align:left;border:0;cursor:pointer;padding:14px 12px 12px;box-sizing:border-box}
.ride .bar{height:6px;border-radius:100px;background:rgba(255,255,255,.4);overflow:hidden}
.ride .bar i{display:block;height:6px;border-radius:100px;transition:width .45s cubic-bezier(.22,1,.36,1)}
.ride .dm{display:flex;align-items:flex-end;line-height:0}
.ride .dm>div{display:grid;justify-items:center;align-items:center}
.ride .dm i{display:block;border-radius:50%}

@media (max-width:720px){
  header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 0;flex-direction:column;gap:6px}
  .status{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .lbl{font-size:13px;padding:10px 8px 10px 4px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
const A='a/';
const P=[
  {id:'your-ride', slug:'your-ride', title:'Your Ride', line:'Compare e-rides by distance, or by the time you have.', about:'distance & time', c:'sage',
   media:{type:'video',src:A+'ride_loop.mp4'},
   leaves:[{name:'try-it', kind:'ride'},{name:'demo.mp4', kind:'video', src:A+'ride.mp4', title:'Your Ride'}]},
  {id:'ink-bloom', slug:'ink-bloom', title:'Ink Bloom', line:'Touch a real plant and an ink painting grows on screen.', about:'touch', c:'bone',
   media:{type:'video',src:A+'ink_loop.mp4'},
   leaves:[{name:'demo.mp4', kind:'video', src:A+'ink.mp4', title:'Ink Bloom', portrait:true}]},

/* ---------------- utilities ---------------- */
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
const gauss=()=>(rnd()+rnd()+rnd()-1.5)/1.5;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s);};
const COLORS=['#3d2f28','#5f5768','#1b1918','#8b7864','#b4c17a','#8aa45d'];
const MOSS=4, MOSS2=5;

/* ---------------- geometry ---------------- */
const L=1900, SP=340, X0=250;
const trunkY=x=>10*Math.sin(x/170)+6*Math.sin(x/53+1.3);
function polyline(fn,n){ const pts=[]; for(let i=0;i<=n;i++) pts.push(fn(i/n)); return pts; }
function measure(pts){ const c=[0]; for(let i=1;i<pts.length;i++) c.push(c[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])); return c; }
function at(pts,cum,s){ let i=1; while(i<cum.length-1 && cum[i]<s) i++; const t=(s-cum[i-1])/((cum[i]-cum[i-1])||1); const a=pts[i-1], b=pts[i]; return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, b[0]-a[0], b[1]-a[1]]; }
const qbez=(a,c,b)=>t=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*c[0]+t*t*b[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*c[1]+t*t*b[1]];

const trunkPts=polyline(t=>[-40+t*(L+40), trunkY(-40+t*(L+40))],180);
const proj=P.map((p,i)=>{
  const dir=i%2?1:-1, ax=X0+i*SP, a=[ax,trunkY(ax)];
  const node=[ax+150, dir*235];
  const pts=polyline(qbez(a,[ax+18,dir*150],node),40);
  const ang=dir<0?-0.62:0.62;
  return {i,dir,ax,a,node,pts,ang};
});

/* ---------------- branches made of pixels ---------------- */
const branches=[]; // {key, group, start, die, dots:[[x,y,b]...] per color, maxB}
function newBranch(key,group,start){ const b={key,group,start,die:null,dots:COLORS.map(()=>[]),maxB:0}; branches.push(b); return b; }
function push(b,ci,x,y,birth){ b.dots[ci].push(x,y,birth); if(birth>b.maxB) b.maxB=birth; }
function grow(b,pts,o){
  const cum=measure(pts), len=cum[cum.length-1];
  const tip=o.tip??.18, hot=o.hot||[];
  for(let s=0;s<len;s+=2.4){
    const t=s/len, [x,y,dx,dy]=at(pts,cum,s), m=Math.hypot(dx,dy)||1, nx=-dy/m, ny=dx/m;
    const w=o.w0+(o.w1-o.w0)*Math.pow(t,.8), birth=o.delay+s/o.speed;
    if(t>1-tip){ // tip turns into single dots
      const k=(t-(1-tip))/tip;
      if(rnd()<.62-k*.35 && hash(Math.floor(s/(4+k*10))+o.sd)>.3) push(b,rnd()<.5?2:1,x+gauss()*1.2,y+gauss()*1.2,birth+rnd()*.15);
      if(rnd()<.05*(1-k)) push(b,MOSS,x+gauss()*4,y+gauss()*4,birth+.4+rnd()*.5);
      continue;
    }
    if(w<4 && hash(Math.floor(s/16)+o.sd)>.9) continue; // breaks
    const n=Math.max(1,Math.round(w*.62*(.6+rnd()*.8)));
    for(let k=0;k<n;k++){
      const spread=rnd()<.2?2:1, off=(rnd()*2-1)*(w/2)*spread;
      const r=rnd(), ci=r<.42?0:r<.72?1:r<.93?2:3;
      push(b,ci,x+nx*off+gauss()*.8,y+ny*off+gauss()*.8,birth+rnd()*.18);
    }
    let d=1e9; hot.forEach(h=>{d=Math.min(d,Math.hypot(x-h[0],y-h[1]));});
    const pm=(o.moss??.5)*Math.exp(-d/75)*Math.pow(1-t,1.2)+.03*(1-t);
    if(rnd()<pm){ const c=1+Math.floor(rnd()*3); for(let k=0;k<c;k++) push(b,rnd()<.82?MOSS:MOSS2,x+nx*(rnd()*2-1)*(w*.8+5)+gauss()*2,y+ny*(rnd()*2-1)*(w*.8+5)+gauss()*2,birth+.5+rnd()*.7); }
  }
  return len;
}
function clump(b,x,y,r,n,delay){ for(let k=0;k<n;k++){ const a=rnd()*6.283, d=Math.pow(rnd(),.7)*r; push(b,rnd()<.8?MOSS:MOSS2,x+Math.cos(a)*d*1.3,y+Math.sin(a)*d*.8,delay+rnd()*.9+d/r*.5); } }
function twig(b,x,y,ang,len,delay,sd){
  const c=[x+Math.cos(ang)*len*.5+gauss()*10, y+Math.sin(ang)*len*.5+gauss()*10], e=[x+Math.cos(ang)*len, y+Math.sin(ang)*len];
  grow(b,polyline(qbez([x,y],c,e),14),{w0:2.6,w1:.6,speed:150,delay,tip:.45,moss:.3,hot:[[x,y]],sd});
}

const T0=performance.now()/1000; const now=()=>performance.now()/1000-T0;
const TRUNK_START=.5, TRUNK_SPEED=360;
const reachT=x=>TRUNK_START+(x+40)/TRUNK_SPEED;
const labelTimes={};
function buildTree(){
  const tb=newBranch('trunk',-1,0);
  const forks=proj.map(p=>p.a);
  grow(tb,trunkPts,{w0:8,w1:3.2,speed:TRUNK_SPEED,delay:TRUNK_START,tip:.07,moss:.9,hot:[[0,0],...forks],sd:1});
  clump(tb,0,0,18,110,TRUNK_START+.3);
  for(let k=0;k<9;k++){ const x=80+k*205+rnd()*60; twig(tb,x,trunkY(x),(rnd()<.5?-1:1)*(.7+rnd()*.9)+(rnd()<.5?0:3.14)*0,50+rnd()*60,reachT(x)+.2,20+k); }
  labelTimes.root=TRUNK_START+.2;
  proj.forEach(p=>{
    const sb=newBranch('stem'+p.i,p.i,0), st=reachT(p.ax);
    const len=grow(sb,p.pts,{w0:5,w1:2.4,speed:190,delay:st,tip:.04,moss:1,hot:[p.a,p.node],sd:40+p.i});
    clump(sb,p.node[0],p.node[1],14,70,st+len/190+.2);
    clump(sb,p.a[0],p.a[1]+p.dir*6,12,45,st+.3);
    twig(sb,p.pts[22][0],p.pts[22][1],p.dir*(1.2+rnd()*.5)+(rnd()<.5?.6:-.9),40+rnd()*40,st+1,60+p.i);
    labelTimes['p'+p.i]=st+len/190+.1;
  });
}
function buildLeaves(p){
  const b=newBranch('leaf'+p.i,p.i,now()+.55);
  const n=P[p.i].leaves.length, len=170+n*150;
  const dx=Math.cos(p.ang), dy=Math.sin(p.ang), px=-dy, py=dx, bend=p.dir*-26;
  const pts=polyline(t=>[p.node[0]+dx*len*t+px*Math.sin(t*Math.PI)*bend, p.node[1]+dy*len*t+py*Math.sin(t*Math.PI)*bend],50);
  const cum=measure(pts), speed=210;
  const leafPos=P[p.i].leaves.map((_,j)=>{ const s=125+j*150; const [x,y]=at(pts,cum,s); return {x,y,s}; });
  grow(b,pts,{w0:3.8,w1:1.2,speed,delay:0,tip:.16,moss:.9,hot:[p.node,...leafPos.map(l=>[l.x,l.y])],sd:90+p.i});
  leafPos.forEach((l,j)=>{
    clump(b,l.x,l.y,7,22,l.s/speed+.3);
    const side=(j%2?1:-1);
    twig(b,l.x,l.y,p.ang+side*1.1,22+rnd()*22,l.s/speed+.2,120+j);
    l.t=b.start+l.s/speed+.15;
  });
  p.open={branch:b,pts,leafPos,len};
}

/* ---------------- camera ---------------- */
const cv=$('#tree'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const cam={x:0,y:0,z:1.6,r:0};
const input={mx:.18,my:.5,drag:0,wheel:0,touch:false};
let openIdx=-1;
function baseZoom(){ return Math.max(.42,Math.min(.82,H/1000,W/760)); }
function target(){
  const z0=baseZoom(), t=now();
  if(openIdx<0){
    const span=L+260, range=Math.max(0,span-W/z0*.82);
    let x=L/2-20 + (input.touch?0:(input.mx-.5)*range) + input.drag + input.wheel;
    x=Math.max(L/2-20-range/2-40,Math.min(L/2-20+range/2+40,x));
    if(t<1.2 && !reduce) return {x:60,y:0,z:z0*1.5,r:0,k:.9};
    return {x, y:(input.touch?0:(input.my-.5)*70), z:z0, r:0, k:t<6?.55:1.5};
  }
  const p=proj[openIdx], o=p.open, dx=Math.cos(p.ang), dy=Math.sin(p.ang);
  const along=o.len*.5 + (input.touch?0:(input.mx-.5)*o.len*.45) + input.drag + input.wheel;
  const r=Math.max(-.5,Math.min(.5,-.21-p.ang));
  return {x:p.node[0]+dx*along, y:p.node[1]+dy*along, z:z0*1.32, r, k:1.1};
}
function toScreen(x,y){ const c=Math.cos(cam.r), s=Math.sin(cam.r), X=x-cam.x, Y=y-cam.y; return [W/2+(X*c-Y*s)*cam.z, H/2+(X*s+Y*c)*cam.z]; }
function toWorld(sx,sy){ const X=(sx-W/2)/cam.z, Y=(sy-H/2)/cam.z, c=Math.cos(-cam.r), s=Math.sin(-cam.r); return [cam.x+X*c-Y*s, cam.y+X*s+Y*c]; }

function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; }

/* ---------------- labels ---------------- */
const labelsEl=$('#labels');
const ICON={
  folder:'<svg viewBox="0 0 17 15"><path d="M1 3.2V13.4c0 .3.3.6.6.6h13.8c.3 0 .6-.3.6-.6V4.6c0-.3-.3-.6-.6-.6H7.6L6 2.2H1.6c-.3 0-.6.3-.6.6z"/></svg>',
  open:'<svg viewBox="0 0 17 15"><path d="M1 3V13.4c0 .3.3.6.6.6h12.2V4.6c0-.3-.3-.6-.6-.6H6.9L5.4 2.2H1.6c-.3 0-.6.3-.6.6z"/><path class="fold-front" d="M3.4 6.6h12.7c.3 0 .5.3.4.6l-2 6.3c-.1.3-.3.5-.6.5H1.6l1.3-7c.1-.2.3-.4.5-.4z"/></svg>',
  file:'<svg viewBox="0 0 17 15"><path d="M4 1h6.4L13.6 4.2V14H4z"/><path d="M10.4 1v3.2h3.2" style="fill:none"/><path d="M6 7h5.5M6 9.2h5.5M6 11.4h3.6" style="fill:none"/></svg>',
  link:'<svg viewBox="0 0 17 15"><path d="M4 1h6.4L13.6 4.2V14H4z"/><path d="M7 10.5l4-4M8.2 6.5H11v2.8" style="fill:none"/></svg>'
};
const nodes=[]; // {el, x, y, key, t}
function addLabel(key,x,y,html,attrs,t,cls,oy=0){
  const tag=attrs.href?'a':'button', el=document.createElement(tag);
  el.className='lbl '+(cls||''); el.innerHTML=html;
  Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
  labelsEl.appendChild(el); const n={el,x,y,key,t,oy}; nodes.push(n); return n;
}
function removeLabels(prefix){ for(let i=nodes.length-1;i>=0;i--) if(nodes[i].key.startsWith(prefix)){ const el=nodes[i].el; el.classList.remove('on'); setTimeout(()=>el.remove(),900); nodes.splice(i,1);} }
function buildLabels(){
  addLabel('root',-6,34,`<span class="nm">alistar &amp; claude/</span>`,{type:'button','data-root':'1','aria-label':'Back to all projects'},labelTimes.root,'root');
  proj.forEach(p=>{
    const d=P[p.i];
    addLabel('p'+p.i,p.node[0],p.node[1],ICON.folder+`<span class="nm">${d.slug}/</span>`,{type:'button','data-p':p.i,'aria-expanded':'false','aria-label':`${d.title}. ${d.line}`},labelTimes['p'+p.i],'proj');
  });
}
function buildLeafLabels(p){
  P[p.i].leaves.forEach((lf,j)=>{
    const l=p.open.leafPos[j], icon=lf.kind==='link'?ICON.link:ICON.file;
    const attrs=lf.kind==='link'?{href:lf.href,target:'_blank',rel:'noopener'}:{type:'button','data-leaf':p.i+'-'+j};
    addLabel('leaf'+p.i+'-'+j,l.x,l.y,icon+`<span class="nm">${lf.name}${lf.kind==='link'?' ↗':''}</span>`,attrs,l.t,'leaf',-24);
  });
}

/* ---------------- frame loop ---------------- */
let last=performance.now()/1000;
function frame(){
  const tn=performance.now()/1000, dt=Math.min(.12,tn-last); last=tn;
  const t=now(), tg=target(), k=reduce?1:1-Math.exp(-dt*tg.k);
  cam.x+=(tg.x-cam.x)*k; cam.y+=(tg.y-cam.y)*k; cam.z+=(tg.z-cam.z)*k; cam.r+=(tg.r-cam.r)*k;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  const Pz=Math.max(2,Math.round(3.4*cam.z));
  const c=Math.cos(cam.r), s=Math.sin(cam.r), z=cam.z, hw=W/2, hh=H/2, cx=cam.x, cy=cam.y;
  for(let bi=branches.length-1;bi>=0;bi--){
    const b=branches[bi], age=t-b.start;
    let cut=Infinity; if(b.die!==null){ cut=b.maxB-(t-b.die)*3.2; if(cut<0){ branches.splice(bi,1); continue; } }
    const dim=openIdx>=0 && b.group!==openIdx ? (b.group===-1?.5:.26) : 1;
    for(let ci=0;ci<COLORS.length;ci++){
      const d=b.dots[ci]; if(!d.length) continue;
      ctx.fillStyle=COLORS[ci]; ctx.globalAlpha=dim*(ci>=MOSS?.92:1);
      for(let j=0;j<d.length;j+=3){
        const bb=d[j+2]; if(!reduce && (bb>age || bb>cut)) continue;
        const X=d[j]-cx, Y=d[j+1]-cy, sx=hw+(X*c-Y*s)*z, sy=hh+(X*s+Y*c)*z;
        if(sx<-4||sy<-4||sx>W+4||sy>H+4) continue;
        ctx.fillRect(Math.floor(sx/Pz)*Pz,Math.floor(sy/Pz)*Pz,Pz,Pz);
      }
    }
  }
  ctx.globalAlpha=1;
  nodes.forEach(n=>{
    const [sx,sy]=toScreen(n.x,n.y);
    n.el.style.transform=`translate(${Math.round(sx-10)}px,${Math.round(sy-15+n.oy)}px)`;
    if(reduce || t>=n.t) n.el.classList.add('on');
  });
  if(ovFor!==null && ovAnchor && !ov.classList.contains('sheet')) placeOv(ovAnchor);
  requestAnimationFrame(frame);
}

/* ---------------- open / close ---------------- */
function setDim(){
  nodes.forEach(n=>{
    const pk=n.key.match(/^p(\d)/), isOpen=openIdx>=0;
    n.el.classList.toggle('dim', isOpen && pk && +pk[1]!==openIdx);
    if(pk){ n.el.classList.toggle('open',+pk[1]===openIdx); n.el.setAttribute('aria-expanded',+pk[1]===openIdx); n.el.querySelector('svg').outerHTML=(+pk[1]===openIdx?ICON.open:ICON.folder); }
    if(n.key==='root') n.el.classList.toggle('anc',isOpen);
  });
  const d=P[openIdx];
  $('#crumb').innerHTML=d?`<span>alistar &amp; claude/</span><b>${d.slug}/</b>`:'<b>alistar &amp; claude/</b>';
  $('#count').textContent=d?`${d.leaves.length} item${d.leaves.length>1?'s':''}`:`${P.length} items`;
}
function closeOpen(){
  if(openIdx<0) return;
  const p=proj[openIdx]; p.open.branch.die=now(); removeLabels('leaf'+openIdx); p.open=null;
  const was=openIdx; openIdx=-1; input.drag=0; input.wheel=0; setDim();
  return was;
}
function openProject(i){
  hideOv();
  if(openIdx===i){ const was=closeOpen(); nodes.find(n=>n.key==='p'+was)?.el.focus({preventScroll:true}); return; }
  closeOpen();
  openIdx=i; input.drag=0; input.wheel=0;
  buildLeaves(proj[i]); buildLeafLabels(proj[i]); setDim();
}

/* ---------------- overview ---------------- */
const ov=$('#ov'); let ovFor=null, ovAnchor=null;
function fillOv(i){
  const p=P[i]; if(ovFor===i) return; ovFor=i;
  const m=$('#ovMedia'); m.innerHTML='';
  if(p.media.type==='video'){ const v=document.createElement('video'); v.muted=true; v.loop=true; v.playsInline=true; v.autoplay=true; v.setAttribute('muted',''); v.src=p.media.src; m.appendChild(v); v.play().catch(()=>{}); }
  else if(p.media.type==='polaroid'){ m.innerHTML=`<div class="pmini"><div class="ph"><img src="${A}hand.jpg" alt=""><div class="milk"></div></div><span class="st">🌼</span></div>`; }
  ov.dataset.c=p.c;
  $('#ovTitle').textContent=p.title;
  $('#ovLine').innerHTML=p.line+(p.lineTbd?' <span class="tbd">(copy tbd)</span>':'');
  $('#ovAbout').innerHTML=`please note, this project is about: <u>${p.about}</u>`;
}
function placeOv(el){
  const r=el.getBoundingClientRect(), w=290, h=ov.offsetHeight||360;
  let x=r.right+16; if(x+w>innerWidth-12) x=r.left-w-16; x=Math.max(12,x);
  let y=r.top-h*.35; y=Math.max(12,Math.min(innerHeight-h-50,y));
  ov.style.left=x+'px'; ov.style.top=y+'px';
}
function showOv(i,el,sheet){
  fillOv(i); ovAnchor=el; ov.classList.toggle('sheet',!!sheet);
  if(!sheet) placeOv(el);
  ov.setAttribute('aria-hidden','false'); requestAnimationFrame(()=>ov.classList.add('show'));
}
function hideOv(){ ov.classList.remove('show'); ov.setAttribute('aria-hidden','true'); ovAnchor=null; sel=null; }
let sel=null;
$('#ovOpen').onclick=()=>openProject(ovFor);
$('#ovClose').onclick=hideOv;

/* ---------------- input ---------------- */
let lastPointer='mouse', dragStart=null, dragMoved=0;
addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse' && !e.target.closest?.('.lbl') && !e.target.closest?.('.ov')){ input.touch=false; input.mx=e.clientX/innerWidth; input.my=e.clientY/innerHeight; }
  if(dragStart){ const dx=e.clientX-dragStart.x; dragMoved=Math.max(dragMoved,Math.abs(dx)); input.drag=dragStart.d-dx/cam.z; }
});
cv.addEventListener('pointerdown',e=>{ lastPointer=e.pointerType; if(e.pointerType!=='mouse'){ input.touch=true; dragStart={x:e.clientX,d:input.drag}; dragMoved=0; } });
addEventListener('pointerup',e=>{
  if(dragStart && e.target===cv && dragMoved<6){ if(openIdx>=0) closeOpen(); hideOv(); }
  dragStart=null;
});
cv.addEventListener('click',e=>{ if(lastPointer==='mouse'){ if(openIdx>=0) closeOpen(); hideOv(); } });
addEventListener('wheel',e=>{ if(!$('#viewer').hidden) return; const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY; input.wheel=Math.max(-900,Math.min(900,input.wheel+d/cam.z)); },{passive:true});
labelsEl.addEventListener('pointerdown',e=>{ lastPointer=e.pointerType; });
labelsEl.addEventListener('pointerover',e=>{ const b=e.target.closest('.lbl.proj'); if(!b||e.pointerType!=='mouse') return; const i=+b.dataset.p; if(i!==openIdx) showOv(i,b,false); });
labelsEl.addEventListener('pointerout',e=>{ const b=e.target.closest('.lbl.proj'); if(b&&e.pointerType==='mouse'&&!b.contains(e.relatedTarget)) hideOv(); });
labelsEl.addEventListener('focusin',e=>{ const b=e.target.closest('.lbl.proj'); if(b&&b.matches(':focus-visible')&&+b.dataset.p!==openIdx) showOv(+b.dataset.p,b,false); });
labelsEl.addEventListener('focusout',()=>{ if(!ov.classList.contains('sheet')) hideOv(); });
labelsEl.addEventListener('click',e=>{
  const r=e.target.closest('[data-root]'); if(r){ closeOpen(); hideOv(); return; }
  const b=e.target.closest('.lbl.proj');
  if(b){ const i=+b.dataset.p;

  const q=s=>root.querySelector(s), sl=q('#rSl');
  function render(full){
    const km=st.unit==='km', tm=st.mode==='time', sel=MODES.find(m=>m.id===st.sel), amt=st.amount;
    const miles=tm?0:(km?amt/MI:amt), mins=tm?amt:0, dL=km?'km':'mi', sL=km?'km/h':'mph', conv=m=>km?m*MI:m;
    let hero,hU,hS,rW,rF,rN,rNC,rM;
    if(tm){ const raw=sel.mph*mins/60, reach=Math.min(raw,sel.range), cap=raw>sel.range+.001; hero=fmt(conv(reach)); hU=dL; hS=fmt(mins)+' min at '+fmt(conv(sel.mph))+' '+sL; rW=Math.min(100,reach/sel.range*100)+'%'; rF=cap?WARN:GRAD; rN=cap?'Battery limit at '+fmt(conv(sel.range))+' '+dL:'range used'; rNC=cap?WARN:'rgba(255,255,255,.95)'; }
    else { const t=fmtTime(miles/sel.mph*60), over=miles>sel.range+.001; hero=t.v; hU=t.u; hS=fmt(conv(miles))+' '+dL+' at '+fmt(conv(sel.mph))+' '+sL; rW=Math.min(100,miles/sel.range*100)+'%'; rF=over?WARN:GRAD; rN=over?'Exceeds range by '+fmt(conv(miles-sel.range))+' '+dL:'range used'; rNC=over?WARN:'rgba(255,255,255,.95)'; }
    rM=fmt(conv(sel.range))+' '+dL+' range';
    q('#rMi').style.color=km?'rgba(255,255,255,.6)':'#fff'; q('#rKm').style.color=km?'#fff':'rgba(255,255,255,.6)';
    q('#rD').style.fontWeight=tm?400:600; q('#rT').style.fontWeight=tm?600:400; q('#rD').style.color=tm?'rgba(255,255,255,.8)':'#fff'; q('#rT').style.color=tm?'#fff':'rgba(255,255,255,.8)';
    if(!st.editing) q('#rBig').innerHTML=`<button id="rEdit" title="Tap to type an exact value" style="background:none;border:0;padding:0 24px;cursor:pointer;height:56px;display:flex;align-items:center">${dots(fmt(amt),8)}</button>`;
    sl.max=tm?180:(km?80:50); if(full) sl.value=amt; sl.setAttribute('aria-label',tm?'Time available in minutes':'Distance to travel');
    q('#rMax').textContent=tm?'180 min':(km?'80 km':'50 mi');
    q('#rChips').innerHTML=MODES.map(m=>{ const on=m.id===sel.id; return `<button class="chip" data-m="${m.id}"><span style="background:${on?GRAD:'transparent'};box-shadow:${on?'none':'inset 0 0 0 .8px #fff'};color:${on?'#1f2622':'#fff'}">${m.short}</span></button>`; }).join('');
    const frac=Math.min(1,sel.mph/26);
    q('#rTrip').innerHTML=`<div style="display:flex;gap:16px;align-items:flex-start"><div style="position:relative;width:140px;height:118px;flex:none">
      <svg viewBox="0 0 140 130" width="140" height="120" role="img" aria-label="Top speed gauge"><defs><linearGradient id="vwG" x1="0" x2="1"><stop offset="0" stop-color="#bdf2b6"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fee7e1"/></linearGradient></defs>
      <circle cx="70" cy="64" r="56" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="10" stroke-linecap="round" stroke-dasharray="263.9 351.9" transform="rotate(135 70 64)"/>
      <circle cx="70" cy="64" r="56" fill="none" stroke="url(#vwG)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${263.9*frac} 351.9" transform="rotate(135 70 64)"/>
      <g transform="rotate(${225+frac*270} 70 64)"><rect x="69" y="32" width="2" height="32" rx="1" fill="#fff"/></g><circle cx="70" cy="64" r="5" fill="none" stroke="#fff" stroke-width="2"/></svg>
      <div style="position:absolute;left:0;right:0;top:86px;text-align:center"><div style="font:400 14px/1 'IBM Plex Sans',system-ui,sans-serif">${fmt(conv(sel.mph))}</div><div class="s12" style="margin-top:3px">${sL}</div></div></div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px"><div style="font:500 14px/1.25 'IBM Plex Sans',system-ui,sans-serif">${sel.name}</div><div style="display:flex;align-items:flex-end;gap:5px">${dots(hero,7)}<span style="font:400 12px/1 'IBM Plex Sans',system-ui,sans-serif;padding-bottom:3px">${hU}</span></div><div class="s12" style="font-weight:400">${hS}</div></div></div>
      <div style="margin-top:14px"><div class="bar"><i style="width:${rW};background:${rF}"></i></div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:8px;font:400 12px/1.3 'IBM Plex Sans',system-ui,sans-serif"><span style="color:${rNC}">${rN}</span><span style="white-space:nowrap">${rM}</span></div></div>`;
    q('#rLegend').textContent=tm?'Bar shows distance reached, relative to the best option.':'Bar shows travel time, relative to the slowest option.';
    const others=MODES.filter(m=>m.id!==sel.id).map(m=>{ if(tm){ const raw=m.mph*mins/60; return {m,v:Math.min(raw,m.range),bad:raw>m.range+.001}; } return {m,v:miles/m.mph*60,bad:miles>m.range+.001}; });
    others.sort((a,b)=>tm?b.v-a.v:a.v-b.v);
    const mx=Math.max(.001,...others.map(o=>o.v));
    q('#rRows').innerHTML=others.map(o=>{ const t=tm?{v:fmt(conv(o.v)),u:dL}:fmtTime(o.v); return `<button class="row glass" data-m="${o.m.id}"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><span style="font:400 14px/1.2 'IBM Plex Sans',system-ui,sans-serif">${o.m.name}</span><span style="white-space:nowrap"><span style="font:400 20px/1 'IBM Plex Sans',system-ui,sans-serif">${t.v}</span><span style="font:400 12px/1 'IBM Plex Sans',system-ui,sans-serif;margin-left:4px">${t.u}</span></span></div><div class="bar" style="margin-top:10px"><i style="width:${o.v/mx*100}%;background:${o.bad?WARN:GRAD}"></i></div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:8px;font:400 12px/1.3 'IBM Plex Sans',system-ui,sans-serif"><span>${fmt(conv(o.m.mph))} ${sL} | ${fmt(conv(o.m.range))} ${dL}</span><span style="font-weight:500;color:${WARN}">${o.bad?'Out of range':''}</span></div></button>`; }).join('');
  }
  root.addEventListener('click',e=>{
    const m=e.target.closest('[data-m]'); if(m){ st.sel=m.dataset.m; render(); return; }
    if(e.target.closest('#rUnit')){ const to=st.unit==='mi'?'km':'mi'; if(st.mode==='dist') st.amount=r1(to==='km'?st.amount*MI:st.amount/MI); st.unit=to; render(true); return; }
    if(e.target.closest('#rD')){ st.mode='dist'; st.amount=st.unit==='km'?19:12; st.editing=false; render(true); return; }
    if(e.target.closest('#rT')){ st.mode='time'; st.amount=30; st.editing=false; render(true); return; }
    if(e.target.closest('#rEdit')){ st.editing=true; q('#rBig').innerHTML=`<input id="rEx" type="number" min="0" step="0.1" value="${st.amount}" aria-label="Enter exact value" style="width:190px;background:rgba(0,0,0,.18);border:.8px solid rgba(255,255,255,.7);border-radius:6px;color:#fff;font:400 44px/1 'IBM Plex Sans',system-ui,sans-serif;text-align:center;padding:8px 10px;outline:none;box-sizing:border-box">`; const ex=q('#rEx'); ex.focus(); ex.select();
      const done=()=>{ if(!st.editing) return; st.editing=false; render(true); };
      ex.addEventListener('input',()=>{ const v=parseFloat(ex.value); st.amount=isNaN(v)?0:Math.max(0,v); render(true); });
      ex.addEventListener('blur',done); ex.addEventListener('keydown',ev=>{ if(ev.key==='Enter') done(); }); }
  });
  sl.addEventListener('input',()=>{ st.amount=parseFloat(sl.value)||0; render(); });
  render(true);
}

/* ---------------- start ---------------- */
resize(); buildTree(); buildLabels(); setDim();
if(reduce){ cam.x=L/2; cam.z=baseZoom(); }
requestAnimationFrame(frame);
</script>

</body>
</html>
